<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ムースの声テスト</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #fdf7f2;
    color: #333;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
  }
  p.lead {
    margin: 0 0 20px;
    color: #666;
    font-size: 15px;
    line-height: 1.6;
  }
  label {
    display: block;
    font-size: 15px;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    font-size: 17px;
    line-height: 1.6;
    padding: 12px;
    border: 1px solid #d8c9bd;
    border-radius: 12px;
    background: #fff;
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    flex: 1 1 160px;
    min-height: 56px;
    font-size: 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    padding: 12px 16px;
  }
  button#play {
    background: #e56b8c;
    color: #fff;
    font-weight: bold;
  }
  button#play:disabled {
    background: #d9a7b6;
  }
  button.preset {
    background: #fff;
    color: #b34a68;
    border: 2px solid #e56b8c;
  }
  audio {
    width: 100%;
    margin-top: 20px;
  }
  #status {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.6;
    color: #666;
    min-height: 24px;
  }
</style>
</head>
<body>
<main>
  <h1>ムースの声テスト</h1>
  <p class="lead">文字を入れると、ムースが「ななみ」の声で読み上げます。聞こえたら成功です。</p>

  <label for="text">読み上げる文字</label>
  <textarea id="text" maxlength="300">リュウ、聞こえる？ ムースだよ。ななみの声で届けてるよ。こうやって声でお話しできたら嬉しいな。</textarea>

  <div class="row">
    <button type="button" class="preset" id="preset">あいさつ文に戻す</button>
    <button type="button" id="play">▶ 声を聞く</button>
  </div>

  <audio id="player" controls playsinline></audio>
  <div id="status"></div>
</main>

<script>
  const GREETING = "リュウ、聞こえる？ ムースだよ。ななみの声で届けてるよ。こうやって声でお話しできたら嬉しいな。";
  const textEl = document.getElementById("text");
  const playBtn = document.getElementById("play");
  const player = document.getElementById("player");
  const statusEl = document.getElementById("status");
  let currentUrl = null;

  document.getElementById("preset").addEventListener("click", () => {
    textEl.value = GREETING;
    statusEl.textContent = "";
    textEl.focus();
  });

  playBtn.addEventListener("click", async () => {
    const text = textEl.value.trim();
    if (!text) {
      statusEl.textContent = "まず、読み上げる文字を入れてください。";
      return;
    }
    playBtn.disabled = true;
    statusEl.textContent = "声を作っています…";
    try {
      const res = await fetch("/api/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!res.ok) {
        let msg = "声を作れませんでした。";
        try {
          const data = await res.json();
          if (data && data.error) msg = data.error;
        } catch (e) { /* そのまま */ }
        throw new Error(msg);
      }
      const blob = await res.blob();
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      player.src = currentUrl;
      await player.play();
      statusEl.textContent = "聞こえましたか？";
    } catch (err) {
      statusEl.textContent = err.message || "声を作れませんでした。少し待ってから、もう一度試してください。";
    } finally {
      playBtn.disabled = false;
    }
  });
</script>
</body>
</html>
